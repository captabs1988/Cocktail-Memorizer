<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speed Rail">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Speed Rail Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Atkinson+Hyperlegible:wght@400;700&family=Azeret+Mono:wght@500;600&display=swap">
<style>
/* Layout: one screen. Top = cocktail name, timer, what's in the glass. Bottom = swipeable colour-coded ingredient panels that flip to measures, then Submit. Bright by default, Night mode via toggle. */
:root{
  --bg:#fdfcf8; --surface:#ffffff; --line:#e6e0d4; --fg:#1a1611; --muted:#6e655a;
  --accent:#ff5a1f; --accent-ink:#ffffff;
  --c-base:#f2700f; --t-base:#ffeedd;
  --c-liq:#d92b72;  --t-liq:#fde4ee;
  --c-juice:#169a59; --t-juice:#ddf4e7;
  --c-sweet:#2a72dc; --t-sweet:#e2edff;
  --c-gar:#8a3fd1;  --t-gar:#f0e4fb;
  --good:#118a49; --good-bg:#e3f5ea; --bad:#e01f1f; --bad-bg:#fde8e8;
  --band:#1d1814; --tray:#fff4c2; --gline:#5c544b; --gfill:rgba(150,190,215,.14);
  --cardback:#b8142c; --cardlace:#e8435a; --cardcream:#fffaf0; --cardink:#1d1814;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;
  --mono:'Azeret Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
:root[data-mode="night"]{
  --bg:#13100e; --surface:#1e1916; --line:#3a312a; --fg:#f5ede3; --muted:#ad9f90;
  --accent:#ff7038; --accent-ink:#1a0c04;
  --c-base:#ff9447; --t-base:#3a2412;
  --c-liq:#ff5c9a;  --t-liq:#3b1627;
  --c-juice:#3dd083; --t-juice:#12301f;
  --c-sweet:#5c9fff; --t-sweet:#14263f;
  --c-gar:#b781f2;  --t-gar:#2b183c;
  --good:#52d88c; --good-bg:#12301e; --bad:#ff6b6b; --bad-bg:#3b1a1a;
  --band:#2c241f; --tray:#3a3216; --gline:#d6c9b9; --gfill:rgba(190,215,235,.08);
  --cardback:#7e1424; --cardlace:#a8303f; --cardcream:#f3e9d9; --cardink:#1d1814;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;transition:background .2s}
#app{height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ghost{min-height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.primary{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px}
.primary:disabled{opacity:.35}
.mode{min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.mode i{width:12px;height:12px;border-radius:50%;background:var(--fg);box-shadow:inset -4px -2px 0 var(--surface)}

/* Home */
.home{height:100%;overflow-y:auto}
.home-in{max-width:560px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:20px}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:64px;line-height:.88;margin:6px 0 0;text-transform:uppercase}
h1 .a{color:var(--c-base)} h1 .b{color:var(--c-liq)}
.stripe{display:flex;gap:6px;margin-top:12px}
.stripe i{height:6px;flex:1;border-radius:3px}
.lede{color:var(--muted);margin:10px 0 0;line-height:1.45;max-width:40ch}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.seg button{min-height:62px;border-radius:14px;border:2px solid transparent;background:var(--t);color:var(--fg);font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.seg button small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.seg button[aria-pressed="true"]{background:var(--c);color:#fff}
.seg button[aria-pressed="true"] small{color:#fff}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;line-height:1.4}
.steps .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--mono);font-size:13px;font-weight:600}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .r{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-family:var(--mono);color:var(--accent);font-size:20px}
details[open] summary::after{content:"\2212"}
.spec{padding:12px 0;border-bottom:1px solid var(--line)}
.spec:last-child{border-bottom:0}
.spec h3{margin:0 0 6px;font-size:16px}
.spec div{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:2px 0}
.spec div span:last-child{font-family:var(--mono);white-space:nowrap;color:var(--muted)}

/* Play: one screen */
.play{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.upper{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding-top:12px}
.top{display:flex;align-items:center;gap:10px}
.prog{flex:1;min-width:0}
.prog .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700}
.prog .lbl b{color:var(--fg);font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c-base),var(--c-liq),var(--c-sweet));border-radius:3px;transition:width .3s}
.namerow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.namerow .nm{min-width:0}
.cname{font-family:var(--display);font-weight:800;font-size:42px;line-height:.92;text-transform:uppercase;text-wrap:balance}
.tmr{font-family:var(--mono);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.glass{flex:1;min-height:0;overflow-y:auto;background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.glass .empty{font-size:14px;color:var(--muted);margin:auto;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 4px 5px 10px;border-radius:999px;background:var(--t);border:1.5px solid var(--c);font-size:14px;font-weight:700;color:var(--fg);height:max-content}
.chip em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--c)}
.chip button{width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:var(--fg);font-size:17px;line-height:1;opacity:.6}

.lower{padding-top:12px;padding-bottom:12px;display:flex;flex-direction:column;gap:10px}
.deck{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;transition:transform .17s ease-in;transform-origin:50% 50%}
.deck.out{transform:perspective(900px) rotateY(90deg)}
.tabs{display:flex;gap:6px;padding:10px 10px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--t);color:var(--fg);font-size:13px;font-weight:700;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--c);color:#fff}
.pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;padding:10px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,50px);gap:7px}
.ing{border-radius:12px;border:2px solid transparent;background:var(--t);color:var(--fg);font-weight:700;font-size:14px;line-height:1.1;text-align:left;padding:6px 10px;position:relative;word-break:break-word}
.ing:active{transform:scale(.96)}
.ing.added{border-color:var(--c)}
.ing.added::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--c)}
.dots{display:flex;justify-content:center;gap:6px;padding:0 0 10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s,width .2s}
.dots i.on{background:var(--c);width:18px;border-radius:4px}
.front.away{visibility:hidden}
.back{position:absolute;inset:0;padding:12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;border-radius:18px;background:var(--t)}
.back .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.howmuch{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-transform:uppercase;color:var(--c)}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.mbtn{min-height:46px;border-radius:12px;border:2px solid var(--c);background:var(--surface);color:var(--fg);font-family:var(--mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.mbtn.wide{grid-column:span 2}
.mbtn:active{background:var(--c);color:#fff}
.backbtn{min-height:36px;padding:0 12px;border-radius:999px;border:0;background:var(--surface);font-weight:700;font-size:13px}

/* Result */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.verdict{border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.verdict.ok{background:var(--good-bg);color:var(--good)}
.verdict.no{background:var(--bad-bg);color:var(--bad)}
.verdict .v{font-family:var(--display);font-weight:800;font-size:38px;text-transform:uppercase;line-height:1}
.verdict .t{font-family:var(--mono);font-weight:600;font-size:22px;text-align:right;font-variant-numeric:tabular-nums}
.verdict .t small{display:block;font-family:var(--body);font-size:12px;font-weight:700}
.badge{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
.col{min-width:0}
.col h4{margin:0 0 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ans{padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.35;color:var(--fg)}
.ans:last-child{border-bottom:0}
.ans .m{font-family:var(--mono);font-size:13px}
.ans s{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2.5px;color:var(--fg)}
.fix{color:var(--bad);font-weight:700}
.fix .m{color:var(--bad)}
.tick{color:var(--good);font-weight:700;margin-right:4px}
.btnrow{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.btnrow .ghost{min-height:54px;font-size:16px}
.big{font-family:var(--display);font-weight:800;font-size:76px;line-height:.9;font-variant-numeric:tabular-nums}
.ic{font-weight:700;width:18px;display:inline-block}
.ic.ok{color:var(--good)} .ic.no{color:var(--bad)}
/* Modes */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.modebtn{text-align:left;padding:12px;border-radius:14px;border:2px solid transparent;background:var(--t);color:var(--fg);min-height:74px;display:flex;flex-direction:column;gap:3px}
.modebtn b{font-size:16px}
.modebtn span{font-size:12.5px;color:var(--muted);line-height:1.3}
.modebtn[aria-pressed="true"]{background:var(--c);color:#fff}
.modebtn[aria-pressed="true"] span{color:#fff;opacity:.9}
.modebtn.wide2{grid-column:span 2}
/* Play layout: dark name band, yellow tray, ingredients left, measure ladder right */
.pl{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.band{background:var(--band);color:#fff;border-radius:0 0 18px 18px;overflow:hidden}
.band-in{display:flex;align-items:center;gap:10px;padding-block:10px}
.bandbtn{min-height:36px;padding:0 10px;border-radius:10px;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-weight:700;font-size:13px;flex:0 0 auto}
.bname{flex:1;min-width:0}
.bmeta{font-size:11.5px;color:rgba(255,255,255,.72);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmeta b{color:#fff;font-family:var(--mono);font-variant-numeric:tabular-nums}
.again{color:#ff8fb8}
.lastlink{border:0;background:transparent;padding:0;color:#ffcf6b;font-weight:700;font-size:11.5px;text-decoration:underline;text-underline-offset:2px}
.cname2{font-family:var(--display);font-weight:800;font-size:30px;line-height:.95;text-transform:uppercase;text-wrap:balance}
.btmr{text-align:right;font-family:var(--mono);font-weight:600;font-size:19px;color:#ffb27a;font-variant-numeric:tabular-nums;white-space:nowrap}
.btmr small{display:block;font-family:var(--body);font-size:10.5px;color:rgba(255,255,255,.65);font-weight:700}
.bar.flat{margin:0;border-radius:0;height:4px;background:rgba(255,255,255,.15)}
.tray{background:var(--tray);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:5px;min-height:34px;max-height:82px;overflow-y:auto;align-content:flex-start}
.tray .empty{font-size:12.5px;color:var(--muted);align-self:center;padding-left:4px}
.chip.sm{font-size:11.5px;padding:2px 2px 2px 8px;gap:4px;border-width:1px}
.chip.sm em{font-size:10.5px}
.chip.sm button{width:22px;height:22px;font-size:14px}
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 66px;gap:8px;padding-block:8px}
.ipanel{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.phd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.minibtn{min-height:30px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:12px;font-weight:700}
.g3{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.gbase{grid-auto-rows:minmax(48px,1fr)}
.gall{grid-auto-rows:minmax(30px,1fr)}
.sec{grid-column:1/-1;border-top:3px solid var(--fg);padding-top:2px;margin-top:3px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg)}
.sec:first-child{margin-top:0}
.gall{grid-auto-rows:auto!important}
.gall .ing2{min-height:30px;font-size:11px!important;padding:2px 5px!important;gap:4px}
.gall .ing2 .sw{width:9px;height:9px}
.gall .ing2 .sw.gar{width:8px;height:8px}
.gall{gap:4px!important}
.ing2 span:last-child{word-break:normal;overflow-wrap:normal;hyphens:manual;min-width:0}
.ing2 .sw{flex:0 0 auto;width:12px;height:12px;border-radius:50%;background:var(--rc);border:1.5px solid color-mix(in srgb,var(--rc) 55%,var(--fg))}
.ing2 .sw.gar{border-radius:2px;transform:rotate(45deg);width:10px;height:10px}
.ing2{border-radius:9px;border:2px solid transparent;background:var(--t);color:var(--fg);font-weight:700;line-height:1.05;text-align:left;padding:3px 7px;position:relative;word-break:break-word;font-size:14px}
.gall .ing2{font-size:11.5px;padding:2px 6px}
.ing2.added{border-color:var(--c)}
.ing2.sel{background:var(--c);color:#fff;border-color:var(--c)}
.ing2:active{transform:scale(.96)}
.ing2{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--rc) 24%,var(--surface))}
.ing2.added{border-color:color-mix(in srgb,var(--rc) 50%,var(--fg))}
.ing2.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ladder{display:flex;flex-direction:column;gap:4px;min-height:0}
.lb{flex:1;min-height:24px;border-radius:9px;border:2px solid var(--c);background:var(--t);color:var(--fg);font-family:var(--mono);font-size:12.5px;font-weight:600;padding:0 2px;font-variant-numeric:tabular-nums}
.lb:active{background:var(--c);color:#fff}
.ladder.off .lb{border-color:var(--line);background:var(--surface);color:var(--muted)}
.ansbtn{flex:0 0 auto;min-height:34px;border-radius:9px;border:0;background:var(--fg);color:var(--bg);font-size:10.5px;font-weight:700;line-height:1.05;padding:2px}
.sw2{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--rc);border:1.5px solid color-mix(in srgb,var(--rc) 55%,var(--fg));margin-right:7px;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tog{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:700}
.tog[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tog[aria-pressed="true"]::before{content:"\2713  "}
.flows{display:flex;flex-direction:column;gap:5px;max-height:64vh;overflow-y:auto}
.flow{display:grid;grid-template-columns:minmax(0,1fr) 9px minmax(0,1fr) 9px minmax(0,1fr) 9px minmax(0,1fr);align-items:stretch;gap:2px;padding:5px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);text-align:center;width:100%}
.flow:active{border-color:var(--fg)}
.st{--kc:var(--c-sweet);--kt:var(--t-sweet);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;border-radius:8px;background:var(--kt);min-width:0}
.st svg,.legend svg{width:20px;height:20px;fill:none;stroke:var(--kc);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.st b{font-size:9.5px;line-height:1.1;font-weight:700;overflow-wrap:anywhere}
.k-prep{--kc:var(--c-sweet);--kt:var(--t-sweet)}
.k-act{--kc:var(--c-base);--kt:var(--t-base)}
.k-strain{--kc:var(--c-liq);--kt:var(--t-liq)}
.k-fin{--kc:var(--c-juice);--kt:var(--t-juice)}
.arr{display:flex;align-items:center;justify-content:center}
.arr svg{width:7px;height:12px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;padding:2px 2px 4px;font-size:11px;font-weight:700;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:3px}
.legend svg{width:15px;height:15px}
.fb .flow{margin-top:6px;border-color:var(--bad)}
.logstat{margin-top:8px;font-size:14px;color:var(--muted)}
.logstat b{font-family:var(--display);font-size:28px;color:var(--fg)}
.logrows{max-height:260px;overflow-y:auto;margin-top:6px}
.logrows .row{font-size:13.5px;align-items:flex-start}

  return {n:Object.entries(g).map(([i,list])=>ING[i].n+' '+ms(i,list)).join(' or '), m:''};
}

/* ---------- Checking ---------- */
function check(rec, build){
  const ls = rec.lines.map(()=>({s:'missing'})), bs = build.map(()=>({s:'extra'}));
  rec.lines.forEach((opts,li) => {
    const b = build.findIndex((it,bi) => bs[bi].s==='extra' && opts.some(o => o.i===it.i && o.m===it.m));
    if (b>-1){ ls[li]={s:'ok'}; bs[b]={s:'ok'}; }
  });
  rec.lines.forEach((opts,li) => {
    if (ls[li].s!=='missing') return;
    const b = build.findIndex((it,bi) => bs[bi].s==='extra' && opts.some(o => o.i===it.i));
    if (b>-1){ const o = opts.find(o=>o.i===build[b].i); ls[li]={s:'measure'}; bs[b]={s:'measure',want:showM(o.i,o.m)}; }
  });
  return {ls, bs, ok: ls.every(l=>l.s==='ok') && bs.every(b=>b.s==='ok')};
}

/* ---------- Practice log: kept 72 hours on this device ---------- */
const LOG_TTL = 72*3600*1000;
const TYPE_N = {build:'Full build', inf:'Infinity', sugar:'Sugar', citrus:'Citrus', garnish:'Garnish', base:'Base', glass:'Glass', method:'Method', picture:'Picture', cards:'Playcards'};
function getLog(){ const now = Date.now(); return store.get('log',[]).filter(e=>now-e.t < LOG_TTL); }
function addLog(e){ if (relax) e = Object.assign({}, e, {ms:0, relax:true}); const l = getLog(); l.push(Object.assign({t:Date.now()}, e)); store.set('log', l.slice(-2000)); }
const ago = t => { const m = Math.round((Date.now()-t)/60000); return m<1?'just now':m<60?m+'m ago':Math.floor(m/60)+'h ago'; };
function logStats(l){
  const byDrink = {}, byType = {}, mistakes = {};
  l.forEach(e=>{
    const d = byDrink[e.id] ||= {n:0,wrong:0,ms:0,tn:0}; d.n++; if(!e.ok) d.wrong++; if (e.ms){ d.ms += e.ms; d.tn++; }
    const ty = byType[e.type] ||= {n:0,wrong:0}; ty.n++; if(!e.ok) ty.wrong++;
    (e.wrong||[]).forEach(w=>{ const k = REC[e.id].name+': '+w; mistakes[k]=(mistakes[k]||0)+1; });
  });
  return {byDrink, byType, mistakes};
}
function localSummary(l){
  const {byDrink, byType, mistakes} = logStats(l);
  const weak = Object.entries(byDrink).filter(([,d])=>d.wrong).sort((a,b)=>b[1].wrong/b[1].n - a[1].wrong/a[1].n || b[1].wrong-a[1].wrong).slice(0,3);
  const avgMs = d => d.tn ? d.ms/d.tn : 0;
  const slowest = Object.entries(byDrink).filter(([,d])=>d.tn).sort((a,b)=>avgMs(b[1]) - avgMs(a[1])).slice(0,3);
  const types = Object.entries(byType).filter(([,t])=>t.wrong).sort((a,b)=>b[1].wrong/b[1].n - a[1].wrong/a[1].n);
  const top = Object.entries(mistakes).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const out = [];
  out.push('FOCUS DRINKS');
  out.push(...(weak.length ? weak.map(([id,d])=>`- ${REC[id].name}: ${d.wrong} wrong out of ${d.n}`) : ['- No misses yet. Push your speed.']));
  if (types.length){ out.push('', 'WEAKEST QUESTION TYPES'); out.push(...types.slice(0,3).map(([t,d])=>`- ${TYPE_N[t]}: ${Math.round(100*(d.n-d.wrong)/d.n)}% right`)); }
  if (top.length){ out.push('', 'REPEAT MISTAKES'); out.push(...top.map(([k,n])=>`- ${k} (${n}x)`)); }
  if (slowest.length){ out.push('', 'SLOWEST DRINKS'); out.push(...slowest.map(([id,d])=>`- ${REC[id].name}: ${fmt(avgMs(d))} average`)); }
  if (weak.length){ out.push('', 'NEXT SESSION'); out.push(`- Run Infinity on ${weak.map(([id])=>REC[id].name).join(', ')} using Custom mode, then a timed Full build round.`); }
  return out.join('\n');
}
async function genSummary(btn){
  const l = getLog(), box = document.getElementById('sumout');
  if (!l.length){ box.hidden=false; box.textContent='No results yet. Play a round first.'; return; }
  box.hidden = false; btn.disabled = true;
  let sample = null;
  try { sample = window.claude?.use ? await window.claude.use('sample') : null; } catch(e){ sample = null; }
  if (!sample){ box.textContent = localSummary(l); btn.disabled = false; return; }
  const {byDrink, byType, mistakes} = logStats(l);
  const weakIds = Object.entries(byDrink).filter(([,d])=>d.wrong).map(([id])=>id);
  const data = {
    answers: l.length,
    byCocktail: Object.fromEntries(Object.entries(byDrink).map(([id,d])=>[REC[id].name,{tries:d.n,wrong:d.wrong,avgSec:d.tn?+(d.ms/d.tn/1000).toFixed(1):null}])),
    byQuestionType: Object.fromEntries(Object.entries(byType).map(([t,d])=>[TYPE_N[t],{tries:d.n,wrong:d.wrong}])),
    repeatMistakes: Object.entries(mistakes).sort((a,b)=>b[1]-a[1]).slice(0,15),
    specsOfWeakDrinks: Object.fromEntries(weakIds.map(id=>[REC[id].name, REC[id].lines.map(o=>{const t=lineText(o);return t.n+' '+t.m;}).join(', ')+' | glass: '+GLASS_OF[id].map(g=>GLASS[g]).join(' or ')+' | method: '+mText(METHOD_OF[id]).join(' > ')]))
  };
  const prompt = `You are a head bartender coaching a bar manager who is memorising 21 house cocktail specs with a speed drill game. Below are his practice results from the last 72 hours as JSON.
Write a short coaching summary for a phone screen. Use these plain-text section headings in capitals: FOCUS DRINKS, WEAKEST AREAS, MISTAKES TO FIX, NEXT SESSION PLAN.
Under each, 2 to 4 short dash bullets. Name specific cocktails and quote the correct spec from specsOfWeakDrinks when fixing a mistake. Mention speed if average times are high.
Rules: no markdown symbols other than dashes, no tables, no em dashes, under 170 words, encouraging but direct.
DATA: ${JSON.stringify(data)}`;
  box.textContent = 'Thinking...';
  try {
    const res = await sample(prompt, {onText:({text})=>{ box.textContent = text; }});
    box.textContent = res.text || localSummary(l);
  } catch(e){
    box.textContent = (e && e.code==='not_granted' ? '' : 'AI summary unavailable right now. Here is the quick breakdown:\n\n') + localSummary(l);
  }
  btn.disabled = false;
}

/* ---------- Round ---------- */
let prevId = null;
let limits = Object.assign({small:12, big:30}, store.get('limits',{}));
const infLimit = id => (REC[id].lines.length > 4 ? limits.big : limits.small) * 1000;
const stepper = (key, label, sub) => `<div class="row"><span><b>${label}</b><br><span class="muted small">${sub}</span></span>
  <span class="stepper"><button data-act="lim" data-k="${key}" data-d="-1" aria-label="Less time">−</button><b>${limits[key]}s</b><button data-act="lim" data-k="${key}" data-d="1" aria-label="More time">+</button></span></div>`;
function startNew(n){ startRound(mode==='custom' ? customItems().slice(0,n) : shuffle(ALL).slice(0,n)); }
function startRound(ids){
  round = {ids, idx:0, results:[], total:0, mode, picOrder:shuffle(ALL)}; cur = null; prevId = null;
  if (mode==='inf'){ round.count=0; nextInf(); } else nextCocktail();
}
const prevBtn = () => prevId ? `<button class="prevbtn" data-act="prev">← Last drink: <b>${REC[prevId].name}</b></button>` : '';
function showPrev(){
  if (!prevId) return;
  const r = REC[prevId], s = document.createElement('div'); s.className='sheet'; s.id='sheet';
  s.innerHTML = `<div class="sheet-in">
    <div class="eyebrow">Last drink · correct spec</div>
    <div class="cname">${r.name}</div>
    <div class="card">${r.lines.map(o=>{const t=lineText(o);return `<div class="ans" style="${tint(ING[o[0].i].p)}"><b>${t.n}</b> <span class="m" style="color:var(--c)">${t.m}</span></div>`}).join('')}</div>
    <button class="primary" data-act="closeprev">Back to ${REC[cur.id].name}</button>
  </div>`;
  document.body.appendChild(s);
}
function nextCocktail(){
  prevId = round.idx ? round.ids[round.idx-1].split(':')[0] : null;
  const key = round.ids[round.idx], [id, t] = key.split(':');
  cur = {id, key, type: t || round.mode, build:[], page:0, pending:null, t0:performance.now(), attempts:1, spent:0, stopped:false, firstOk:null, picks:new Set()};
  if (cur.type==='build') play(); else drill();
}
function nextInf(sameId){
  const prev = cur?.id || null;
  let id = sameId;
  if (!id) do { id = ALL[Math.floor(Math.random()*ALL.length)]; } while (id===prev);
  if (prev && prev !== id) prevId = prev;
  round.count++;
  cur = {id, build:[], page:0, pending:null, inf:true, done:false, t0:performance.now(), stopped:false, spent:0, mistakes:0, wrongs:[], again:!!sameId};
  play();
}
function elapsed(){ return cur.stopped ? cur.last : performance.now()-cur.t0; }

function play(){
  screen='play';
  const r = REC[cur.id], n = round.ids.length, inf = !!cur.inf;
  cur.phase = cur.phase || 'base';
  const meta = inf
    ? `${cur.again?'<span class="again">Again</span> · ':''}Drink ${round.count}`
    : `Drink ${round.idx+1} of ${n}<span class="rtotw"> · Round <b id="rtot">0.0s</b></span>`;
  app.innerHTML = `
  <div class="pl">
    <div class="band"><div class="band-in gut">

        <div class="cname2">${r.name}</div>
      </div>
      <div class="btmr"><span id="tmr">0.0s</span>${inf?`<small>target ${infLimit(cur.id)/1000}s</small>`:''}</div><span class="relaxpill">Relax</span>

/* ---------- Infinity: check each tap straight away ---------- */
function infMissing(){ const r = REC[cur.id], res = check(r, cur.build); return r.lines.filter((o,li)=>res.ls[li].s!=='ok'); }
function infPick(id, btn){
  const r = REC[cur.id], miss = infMissing();
  if (!miss.some(o=>o.some(x=>x.i===id))){
    nope(btn); cur.mistakes++; cur.wrongs.push(`tapped ${ING[id].n}`);
    toast(cur.build.some(b=>b.i===id) || r.lines.some(o=>o.some(x=>x.i===id)) ? `${ING[id].n} is already in` : `No ${ING[id].n} in ${r.name}`, 'bad');
    return false;
  }
  return true;
}
function infMeasure(m, btn){
  const ok = infMissing().some(o=>o.some(x=>x.i===cur.pending && x.m===m));
  if (!ok){ nope(btn); cur.mistakes++; cur.wrongs.push(`${ING[cur.pending].n} ${showM(cur.pending,m)} wrong measure`); toast(`Not ${showM(cur.pending,m)}. Try another measure`, 'bad'); }
  return ok;
}
function infAfterAdd(){
  if (cur.done || infMissing().length) return;
  cur.done = true; cur.last = performance.now()-cur.t0; cur.stopped = true;
  const slow = !relax && cur.last > infLimit(cur.id), repeat = cur.mistakes>0 || slow, name = REC[cur.id].name, id = cur.id;
  const why = [cur.mistakes ? `${cur.mistakes} mistake${cur.mistakes>1?'s':''}` : '', slow ? `over ${infLimit(id)/1000}s` : ''].filter(Boolean).join(', ');
  addLog({type:'inf', id, ok:!repeat, ms:cur.last, wrong:[...cur.wrongs, ...(slow?[`over ${infLimit(id)/1000}s target`]:[])]});
  if (repeat){ infResult(why); return; }
  const rec = relax ? null : setBest(id, cur.last);
  if (relax) toast(`Perfect ${name}!`, 'good', 1300); else toast(rec && rec.prev ? `NEW RECORD! ${name} ${fmt(cur.last)} (was ${fmt(rec.prev)})` : `Perfect ${name}! ${fmt(cur.last)}${rec?' · first record':''}`, 'good', rec&&rec.prev?1800:1300);
  setTimeout(()=>{ if (screen==='play' && cur?.inf && cur.done && cur.id===id) nextInf(); }, 1300);
}
function infResult(why){
  const r = REC[cur.id], s = document.createElement('div'); s.className='sheet'; s.id='sheet';
  s.innerHTML = `<div class="sheet-in">
    <div class="eyebrow">${r.name}</div>
    <div class="verdict no"><div><div class="v">Not quite</div><div style="font-weight:700;margin-top:4px">${why}</div></div>
      <div class="t"><small>Time</small>${fmt(cur.last)}</div></div>
    <div class="eyebrow">Correct spec</div>
    <div class="card">${r.lines.map(o=>{const t=lineText(o);return `<div class="ans"><span class="sw2" style="--rc:${COL[o[0].i]}"></span><b>${t.n}</b> <span class="m">${t.m}</span></div>`}).join('')}</div>
    <div class="btnrow"><button class="ghost" data-act="infnext">Next drink</button><button class="primary" data-act="restart">Restart same</button></div>
  </div>`;
  document.body.appendChild(s);
}
function showAnswer(){
  if (!cur?.inf || cur.done) return;
  const r = REC[cur.id], have = new Set(cur.build.map(b=>b.i)), s = document.createElement('div'); s.className='sheet'; s.id='sheet';
  s.innerHTML = `<div class="sheet-in">
    <div class="eyebrow">Correct spec</div>

    <div class="card">${r.lines.map(o=>{const t=lineText(o), got=o.some(x=>have.has(x.i));return `<div class="ans"><span class="sw2" style="--rc:${COL[o[0].i]}"></span>${got?'<span class="tick">✓</span>':''}<b>${t.n}</b> <span class="m" style="color:var(--c)">${t.m}</span></div>`}).join('')}</div>
    <p class="muted small" style="margin:0">Study it, then rebuild it from memory. The clock starts fresh.</p>
    <div class="btnrow"><button class="ghost" data-act="closeprev">Back</button><button class="primary" data-act="restart">Restart this drink</button></div>
  </div>`;
  document.body.appendChild(s);
}
function infHint(){
  const m = infMissing()[0]; if (!m) return;
  cur.mistakes++; cur.wrongs.push('used hint');
  const t = lineText(m); toast(`Next: ${t.n}${t.m?' · '+t.m:''}`, 'info', 2400);
}

/* ---------- Quick drills: sugar, citrus, garnish ---------- */
/* Every accepted set of answers for a tap-all question. Mai Tai: the dark rum float is optional as a base spirit */
const OPTIONAL_PICK = {mai_tai:['dark_rum']};
function combosOf(r, part){
  const all = r.lines.filter(o=>o.every(x=>ING[x.i].p===part));
  const sets = [all];
  if (OPTIONAL_PICK[r.id]) sets.push(all.filter(o=>!o.some(x=>OPTIONAL_PICK[r.id].includes(x.i))));
  return [...new Set(sets.flatMap(ls=>{ let c=[[]]; ls.map(o=>[...new Set(o.map(x=>x.i))]).forEach(opts=>{ c = c.flatMap(x=>opts.map(i=>[...x,i])); }); return c.map(x=>[...x].sort().join(',')); }))];
}
const DRILL = {
  sugar:  {q:'How much sugar?', k:'sweet', one:['None','5ml','10ml','15ml','20ml','25ml','1 cube'],
           ans:r=>{ const v=[]; r.lines.forEach(o=>o.forEach(x=>{ if(x.i==='sugar') v.push(x.m); if(x.i==='sugar_cube') v.push('1 cube'); })); return v.length?v:['None']; }},
  citrus: {q:'Lime or lemon? How much?', k:'juice', items:['lime','lemon'], noneLbl:'No citrus', meas:['5ml','10ml','15ml','20ml','25ml','30ml'],
           ans:r=>{ const v=[]; r.lines.forEach(o=>o.forEach(x=>{ if(x.i==='lime'||x.i==='lemon') v.push(x.i+'@'+x.m); })); return v.length?v:['none@']; }},
  garnish:{q:'Which garnish? Tap all, then Check', k:'gar', multi:true, items:Object.keys(ING).filter(k=>ING[k].p==='gar'), ans:r=>combosOf(r,'gar')},
  base:   {q:'Which base spirit(s)?', k:'base', multi:true, items:Object.keys(ING).filter(k=>ING[k].p==='base'), ans:r=>combosOf(r,'base')},
  glass:  {q:'Which glass?', k:'sweet', glasses:true, one:Object.keys(GLASS), lbl:v=>GLASS[v], ans:r=>GLASS_OF[r.id]},
  method: {q:'Pick the method', k:'juice', flows:true, ans:r=>[METHOD_OF[r.id]]},
  picture:{q:'Which one is it?', k:'liq', pics:true, ans:r=>[r.id]}
};
const ansText = (mode, a) => {
  if (mode==='base' || mode==='garnish') return a ? a.split(',').map(i=>ING[i].n+(i==='coffee_beans'?' ×3':'')).join(' + ') : 'Nothing picked';
  if (mode==='glass') return GLASS[a];
  if (mode==='picture') return REC[a].name;
  if (mode==='method') return mText(a).join(' → ');
  if (mode==='sugar') return a==='None' ? 'No sugar' : a==='1 cube' ? 'Sugar cube ×1' : 'Sugar syrup '+a;
  const [i,m] = a.split('@'); return i==='none' ? DRILL[mode].noneLbl : ING[i].n+(m?' '+showM(i,m):'');
};

        <div class="back" id="back" hidden></div>

}
function drillItem(i){

function drillAnswer(v){

    : `<div class="fb no"><div class="v">Not quite</div>
        <div>You: <s><b>${ansText(cur.type,v)}</b></s></div>
        <div class="fix">Correct: ${cur.type==='method'?'':right}</div>${cur.type==='method'?flowHTML(correct[0],'div'):''}${cur.type==='glass'?`<div class="gans">${correct.map(g=>`<span class="gbtn ok">${glassSvg(g)}<b>${GLASS[g]}</b></span>`).join('')}<span class="gbtn no">${glassSvg(v)}<b><s>${GLASS[v]}</s></b></span></div>`:''}${cur.type==='picture'?`<div class="gans"><span class="pans ok">${drinkSvg(correct[0])}<b>${REC[correct[0]].name}</b><small>Correct</small></span><span class="pans no">${drinkSvg(v)}<b><s>${REC[v].name}</s></b><small>You picked</small></span></div>`:''}</div>
       <button class="primary" data-act="advance">${last?'Finish round':'Next drink →'}</button>`;
  if (ok) setTimeout(()=>{ if (screen==='drill' && cur.stopped) advance(); }, 800);
}

/* Flip: rotate out, swap faces, rotate back in */
function flip(toBack){
  const deck = document.getElementById('deck'), front = document.getElementById('front'), back = document.getElementById('back');
  const swap = () => { back.hidden = !toBack; front.classList.toggle('away', toBack); };
  if (reduced()){ swap(); return; }
  deck.classList.add('out');
  setTimeout(() => { swap(); deck.classList.remove('out'); }, 170);
}
function drawBack(){
  const id = cur.pending, opts = MEAS[ING[id].t];
  const unit = ING[id].t==='leaf' ? ' (leaves)' : ING[id].t==='count' ? ' (pieces)' : '';
  const b = document.getElementById('back');
  b.setAttribute('style', tint(ING[id].p));
  b.innerHTML = `
    <div class="hd"><div><div class="eyebrow">How much${unit}?</div><div class="howmuch">${ING[id].n}</div></div>
      <button class="backbtn" data-act="unflip">← Back</button></div>
    <div class="mgrid">${opts.map(m=>`<button class="mbtn ${m.length>7?'wide':''}" data-act="meas" data-m="${m}">${m}</button>`).join('')}</div>`;
}

function add(i,m){
  cur.build.push({i,m}); cur.pending=null;
  if (ING[i].p==='base' && cur.build.filter(b=>ING[b.i].p==='base').length===1) cur.phase='all';
  drawPanel(); drawLadder(); drawGlass();
}

function startTick(){ clearInterval(ticker); ticker = setInterval(()=>{
  const t = document.getElementById('tmr'), rt = document.getElementById('rtot');
  if (!t || !cur) return;
  const e = elapsed(); t.textContent = fmt(e);
  if (cur.inf) t.style.color = e > infLimit(cur.id) ? 'var(--bad)' : '';
  if (rt) rt.textContent = fmt(round.total + cur.spent + (cur.stopped?0:e));
},100); }
function stopTick(){ clearInterval(ticker); ticker=null; }

/* ---------- Submit + result ---------- */
function submit(){
  cur.last = performance.now()-cur.t0; cur.stopped = true; cur.spent += cur.last;
  const r = REC[cur.id], res = check(r, cur.build);
  if (cur.firstOk===null) cur.firstOk = res.ok;
  addLog({type:'build', id:cur.id, ok:res.ok, ms:cur.last, wrong:[
    ...cur.build.map((b,k)=>{const x=res.bs[k]; return x.s==='measure'?`${ING[b.i].n} ${showM(b.i,b.m)} (should be ${x.want})`:x.s==='extra'?`added ${ING[b.i].n}`:null;}).filter(Boolean),
    ...r.lines.map((o,li)=>res.ls[li].s==='missing'?`missed ${lineText(o).n}`:null).filter(Boolean)]});
  let best = false;
  if (res.ok && !relax) best = setBest(cur.id, cur.last);
  const last = round.idx === round.ids.length-1;

  const yours = cur.build.map((b,k)=>{
    const s = res.bs[k], nm = ING[b.i].n, m = showM(b.i,b.m);
    if (s.s==='ok') return `<div class="ans"><span class="tick">✓</span><b>${nm}</b> <span class="m">${m}</span></div>`;
    if (s.s==='measure') return `<div class="ans"><b>${nm}</b> <s class="m">${m}</s> <span class="fix"><span class="m">${s.want}</span></span></div>`;
    return `<div class="ans"><s><b>${nm}</b> <span class="m">${m}</span></s> <span class="fix">not in spec</span></div>`;
  });
  r.lines.forEach((o,li)=>{ if (res.ls[li].s==='missing'){ const t=lineText(o); yours.push(`<div class="ans fix">+ <b>${t.n}</b> <span class="m">${t.m}</span></div>`); } });

  const sheet = document.createElement('div'); sheet.className='sheet'; sheet.id='sheet';
  sheet.innerHTML = `<div class="sheet-in">
    <div class="eyebrow">${r.name} · attempt ${cur.attempts}</div>
    <div class="verdict ${res.ok?'ok':'no'}">
      <div><div class="v">${res.ok?'Spot on':'Not quite'}</div>${best?`<span class="badge">${best.first?'First record set':'New record! was '+fmt(best.prev)}</span>`:''}</div>
      <div class="t"><small>This attempt</small>${fmt(cur.last)}</div>
    </div>
    <div class="cols">
      <div class="col"><h4>Your answer</h4>${yours.join('') || '<div class="ans muted">Nothing added</div>'}</div>
      <div class="col"><h4>Correct spec</h4>${r.lines.map(o=>{const t=lineText(o);return `<div class="ans"><b>${t.n}</b> <span class="m">${t.m}</span></div>`}).join('')}</div>
    </div>
    <div class="btnrow">
      <button class="ghost" data-act="retry">Retry</button>
      <button class="primary" data-act="advance">${last?'Finish round':'Next drink →'}</button>
    </div>
  </div>`;
  document.body.appendChild(sheet);
}
function closeSheet(){ document.getElementById('sheet')?.remove(); }

function retry(){
  closeSheet(); cur.attempts++; cur.build=[]; cur.pending=null; cur.stopped=false; cur.t0=performance.now();
  cur.phase='base'; drawPanel(); drawLadder(); drawGlass();
}
function advance(){
  closeSheet();
  round.results.push({id:cur.id, key:cur.key, type:cur.type, time:cur.spent, firstOk:cur.firstOk, attempts:cur.attempts});
  round.total += cur.spent; round.idx++;
  if (round.idx < round.ids.length) nextCocktail(); else finish();
}

/* ---------- End of round ---------- */
function finish(){
  screen='end'; stopTick();
  const n = round.ids.length, score = round.results.filter(r=>r.firstOk).length;
  const rb = store.get(rbKey(round.mode),{}); let best = false;
  if (!relax && [5,10,15,21].includes(n) && (!rb[n] || round.total < rb[n])){ best = !!rb[n]; rb[n]=round.total; store.set(rbKey(round.mode),rb); const ra=store.get('rbAt.'+round.mode,{}); ra[n]=Date.now(); store.set('rbAt.'+round.mode,ra); }
  const hist = store.get('history',[]); if (!relax) hist.unshift({d:Date.now(), n, total:round.total, score, mode:round.mode}); store.set('history',hist.slice(0,30));
  const misses = round.results.filter(r=>!r.firstOk).map(r=>r.key);
  app.innerHTML = `
  <div class="home gut"><div class="home-in">
    <div class="hero"><div>
      <div class="eyebrow">${MODES[round.mode].n} · ${n} ${round.mode==='custom'?'questions':'drinks'}${relax?' · Relax':''}</div>
      <div class="big">${relax ? Math.round(100*score/n)+'%' : fmt(round.total)}</div>
      <p class="lede"><b style="color:var(--fg)">${score} of ${n}</b> right first time${relax?' · accuracy only, no timer':''}${best?' <span class="badge">New record</span>':''}</p>
    </div>${modeBtn()}</div>
    <div class="card"><div class="rows">
      ${round.results.map(r=>`<div class="row"><span><span class="ic ${r.firstOk?'ok':'no'}">${r.firstOk?'✓':'✗'}</span>${REC[r.id].name}${round.mode==='custom'?` <span class="muted small">· ${MODES[r.type].n.replace(' only','')}</span>`:''}${r.attempts>1?` <span class="muted small">· ${r.attempts} tries</span>`:''}</span>${relax?'':`<span class="r">${fmt(r.time)}</span>`}</div>`).join('')}
    </div></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${misses.length?`<button class="primary" data-act="redo" data-ids="${misses.join(',')}">Drill my ${misses.length} miss${misses.length>1?'es':''}</button>`:''}
      <button class="${misses.length?'ghost':'primary'}" style="width:100%;min-height:52px" data-act="again" data-n="${n}">New ${n}-drink round</button>
      <button class="ghost" style="width:100%" data-act="home">Home</button>
    </div>
  </div></div>`;
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if (a==='mode'){ night=!night; store.set('night',night); applyMode(); document.querySelectorAll('.mode').forEach(m=>m.outerHTML=modeBtn()); }
  else if (a==='relax'){ relax=!relax; store.set('relax',relax); applyRelax(); home(); toast(relax?'Relax mode on: timer off':'Timer back on','info',1200); }
  else if (a==='mode-pick'){ mode=b.dataset.m; store.set('mode',mode); home(); }
  else if (a==='size'){ size=+b.dataset.n; store.set('size',size); home(); }
  else if (a==='start' && mode==='cards'){ deck(); }
  else if (a==='start'){ if (mode==='custom' && !(custom.types.length && custom.ids.length)) { toast('Switch on at least one question type and one cocktail','bad'); return; } startNew(size); }
  else if (a==='phase'){ cur.phase=b.dataset.p; cur.pending=null; drawPanel(); drawLadder(); }
  else if (a==='pick'){
    const id=b.dataset.id;
    if (cur.inf && (cur.done || !infPick(id,b))) return;
    if (ING[id].t==='rim'){ add(id,'Rim'); if (cur.inf) infAfterAdd(); return; }
    cur.pending = cur.pending===id ? null : id; drawPanel(); drawLadder();
  }
  else if (a==='meas'){
    if (!cur.pending){ nope(b); toast('Tap an ingredient first','info',1200); return; }
    if (cur.inf && !infMeasure(b.dataset.m,b)) return;
    add(cur.pending, b.dataset.m); if (cur.inf) infAfterAdd();
  }
  else if (a==='unflip'){ cur.pending=null; flip(false); }
  else if (a==='rm'){ if (cur.done) return; cur.build.splice(+b.dataset.k,1); drawPanel(); drawGlass(); }
  else if (a==='hint'){ infHint(); }
  else if (a==='answer'){ if (cur.done) return; cur.mistakes++; cur.wrongs.push('looked at answer'); showAnswer(); }
  else if (a==='cpick'){ openCard(b.dataset.id, true); }
  else if (a==='crand'){ openCard(pickRandom(deckSt.cur), false); }
  else if (a==='cflip'){ flipCard(); }
  else if (a==='cmark'){ markCard(b.dataset.v==='1'); }
  else if (a==='cclose'){ closeSheet(); deck(false); }
  else if (a==='creset'){ deckSt.marks = {}; deck(); }
  else if (a==='summary'){ genSummary(b); }
  else if (a==='infnext'){ closeSheet(); nextInf(); }
  else if (a==='restart'){ closeSheet(); nextInf(cur.id); toast('Same drink, fresh start','info',1000); }
  else if (a==='lim'){ const k=b.dataset.k; limits[k]=Math.min(180,Math.max(3,limits[k]+(+b.dataset.d))); store.set('limits',limits); home(); }
  else if (a==='limreset'){ limits={small:12,big:30}; store.set('limits',limits); home(); }
  else if (a==='prev'){ if (!cur?.done) showPrev(); }
  else if (a==='closeprev'){ closeSheet(); }
  else if (a==='skip'){ const t=REC[cur.id].name; nextInf(); toast(`Skipped ${t}`,'info',1000); }
  else if (a==='ditem'){ drillItem(b.dataset.i); }
  else if (a==='dtog'){ if (cur.stopped) return; const i=b.dataset.i; cur.picks.has(i)?cur.picks.delete(i):cur.picks.add(i); b.classList.toggle('sel'); document.getElementById('dcheck').disabled=!cur.picks.size; }
  else if (a==='dcheck'){ if (cur.picks.size){ document.getElementById('dcheck').hidden=true; drillAnswer([...cur.picks].sort().join(',')); } }
  else if (a==='ctype'){ const t=b.dataset.t; custom.types = custom.types.includes(t) ? custom.types.filter(x=>x!==t) : [...custom.types,t]; store.set('custom',custom); home(); }
  else if (a==='cid'){ const i=b.dataset.i; custom.ids = custom.ids.includes(i) ? custom.ids.filter(x=>x!==i) : [...custom.ids,i]; store.set('custom',custom); home(); }
  else if (a==='call'){ custom.ids = b.dataset.v==='all' ? [...ALL] : []; store.set('custom',custom); home(); }
  else if (a==='dans'){ drillAnswer(b.dataset.v); }
  else if (a==='submit'){ if (cur.build.length) submit(); }
  else if (a==='retry'){ retry(); }
  else if (a==='advance'){ advance(); }
  else if (a==='quit'){
    if (cur?.inf || Date.now()-quitArm < 3000){ round=null; cur=null; home(); }
    else { quitArm=Date.now(); b.textContent='Tap again'; setTimeout(()=>{ const q=document.getElementById('quit'); if(q) q.textContent='Quit'; },3000); }
  }
  else if (a==='redo'){ startRound(shuffle(b.dataset.ids.split(','))); }
  else if (a==='again'){ startNew(+b.dataset.n); }
  else if (a==='home'){ home(); }
});

home();
</script>
